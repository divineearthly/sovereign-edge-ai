name: Build Vedic Kernels
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build libvedic_full.so
        run: aarch64-linux-gnu-gcc -O3 -march=armv8-a+simd -fPIC -shared -o libvedic_full.so vedic_nikhilam_sparsha.c vedic_vilokanam_lib.c vedic_anurupya_cache.c -lm
      - uses: actions/upload-artifact@v4
        with:
          name: libvedic_full-arm64
          path: libvedic_full.so
